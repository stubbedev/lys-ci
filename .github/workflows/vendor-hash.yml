name: vendor-hash

on:
  workflow_call:
    inputs:
      recipe:
        description: The just recipe that rewrites the Nix files holding vendorHash
        type: string
        default: vendor-hash
    secrets:
      VENDOR_HASH_DEPLOY_KEY:
        required: false

permissions:
  contents: read

jobs:
  vendor-hash:
    uses: stubbedev/lys-ci/.github/workflows/regenerate.yml@1637cefd1614eafc73e1f11c2cdff559ba4d3930
    with:
      recipe: ${{ inputs.recipe }}
      paths: "*.nix"
      message: |
        nix: vendorHash for the bumped modules (#${{ github.event.pull_request.number }})

        Dependabot rewrites go.mod and go.sum but not the Nix vendorHash,
        so the fixed-output vendor derivation would fail every Nix build.
    secrets:
      REGENERATE_DEPLOY_KEY: ${{ secrets.VENDOR_HASH_DEPLOY_KEY }}
