name: publish-release

on:
  workflow_call:
    inputs:
      timeout-minutes:
        description: The job's timeout
        type: number
        default: 360

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: release
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes -- *.tar.gz *.deb *.rpm SHA256SUMS
