name: security

on:
  workflow_call:
    inputs:
      go-toolchain:
        description: "Where Go comes from: stable, go.mod (pure Go, CGO_ENABLED=0), or nix (the dev shell, and a reachable vulnerability fails the job)"
        type: string
        default: stable
      bounded-timeouts:
        description: Bound each job's run time instead of GitHub's six-hour default
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.bounded-timeouts && 30 || 360 }}
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "actions"]
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Build without cgo
        if: inputs.go-toolchain == 'go.mod'
        run: echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go' && inputs.go-toolchain == 'go.mod'
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  grype:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.bounded-timeouts && 20 || 360 }}
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          path: "."
          fail-build: true
          severity-cutoff: critical
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.bounded-timeouts && 20 || 360 }}
    permissions:
      security-events: write
      contents: read
    env:
      PINNED_GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
    steps:
      - name: Reject an unknown go-toolchain
        env:
          GO_TOOLCHAIN: ${{ inputs.go-toolchain }}
        run: |
          case "$GO_TOOLCHAIN" in
            stable | go.mod | nix) ;;
            *)
              echo "::error::go-toolchain must be stable, go.mod or nix, but is: $GO_TOOLCHAIN"
              exit 1
              ;;
          esac
      - name: Build without cgo
        if: inputs.go-toolchain == 'go.mod'
        run: echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.go-toolchain != 'nix'
        with:
          go-version: ${{ inputs.go-toolchain == 'stable' && 'stable' || '' }}
          go-version-file: ${{ inputs.go-toolchain == 'go.mod' && 'go.mod' || '' }}
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        if: inputs.go-toolchain == 'nix'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://nix.stubbe.dev/c/default/default
            extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
      - name: Install govulncheck
        if: inputs.go-toolchain != 'nix'
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        if: inputs.go-toolchain != 'nix'
        run: govulncheck -C . -format sarif ./... > results.sarif
      - name: Run govulncheck in the dev shell
        if: inputs.go-toolchain == 'nix'
        run: nix develop --accept-flake-config -c sh -c "go run $PINNED_GOVULNCHECK -C . -format sarif ./... > results.sarif"
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
      - name: Fail on reachable vulnerabilities
        if: inputs.go-toolchain == 'nix'
        run: nix develop --accept-flake-config -c go run "$PINNED_GOVULNCHECK" ./...

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.bounded-timeouts && 10 || 360 }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          allow-licenses: BSD-2-Clause, BSD-3-Clause, MIT, MIT-0, Apache-2.0, MPL-2.0, ISC, LicenseRef-scancode-google-patent-license-golang, Unlicense, CC-BY-4.0
